  <style>
    /* المتغيرات والتصميم العام */
    :root {
      --brand-teal: #00A8C6;
      --brand-teal-dark: #007A8F;
      --brand-teal-light: #E6F7F9;
      --brand-lime: #8CC63F;
      --brand-lime-dark: #659624;
      --brand-lime-light: #F2F9E8;
      --bg-white: #FFFFFF;
      --bg-soft: #F8FBFB;
      --bg-card: #FFFFFF;
      --text-main: #1A2E35;
      --text-muted: #5A7175;
      --border-color: #E2ECE9;
      --color-gold: #FFB800;
      --color-blue: #0284C7;
      --color-purple: #7C3AED;
      --color-wa: #25D366;
      --color-wa-hover: #1EBE5D;
      --font-primary: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 20px rgba(0, 168, 198, 0.08);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.09);
      --transition: all 0.25s ease-in-out;
      --sidebar-width: 320px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-primary);
      background-color: var(--bg-soft);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      direction: rtl;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      right: 16px;
      background: var(--brand-teal);
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      z-index: 9999;
      text-decoration: none;
      font-weight: 700;
      transition: top 0.2s;
    }
    .skip-link:focus {
      top: 16px;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      margin-inline: auto;
      padding-inline: 20px;
    }

    /* الشريط العلوي */
    .topbar {
      background: linear-gradient(90deg, var(--brand-teal-dark), var(--brand-teal));
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar-badges {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .partner-pill {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .topbar-phone {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ترويسة الموقع */
    .site-header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 900;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 12px;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }
    .logo-icon-wrap {
      width: 48px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .site-logo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .site-logo-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .logo-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--brand-teal-dark);
      line-height: 1.2;
    }
    .logo-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .main-nav {
      display: none;
      gap: 20px;
      align-items: center;
    }
    .main-nav a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 700;
      transition: var(--transition);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
    }
    .main-nav a:hover {
      color: var(--brand-teal);
      background-color: var(--brand-teal-light);
    }
    .nav-cta {
      background: linear-gradient(135deg, var(--brand-teal), var(--brand-teal-dark));
      color: #fff !important;
      padding: 8px 18px !important;
      border-radius: var(--radius-full) !important;
      box-shadow: var(--shadow-sm);
    }
    .nav-cta:hover {
      background: var(--brand-teal-dark) !important;
      transform: translateY(-1px);
    }

    /* تخطيط الشاشات الكبيرة */
    @media (min-width: 992px) {
      .main-nav {
        display: flex;
      }
      #main-content {
        margin-right: var(--sidebar-width);
        max-width: calc(100% - var(--sidebar-width));
      }
      #doctors-sidebar {
        position: fixed;
        top: 86px;
        right: 0;
        width: var(--sidebar-width);
        height: calc(100vh - 86px);
        background: #ffffff;
        border-left: 1px solid var(--border-color);
        box-shadow: -4px 0 20px rgba(0, 0, 0, 0.04);
        overflow-y: auto;
        z-index: 850;
        padding: 20px 14px 40px;
      }
    }

    /* تخطيط الهواتف */
    @media (max-width: 991px) {
      #main-content {
        margin-right: 0;
        max-width: 100%;
      }
      #doctors-sidebar {
        position: static;
        width: 100%;
        max-width: 100%;
        height: auto;
        padding: 30px 16px;
        background: #ffffff;
        border-bottom: 1px solid var(--border-color);
      }
      .doctors-grid {
        display: flex !important;
        overflow-x: auto !important;
        scroll-snap-type: x mandatory;
        padding-bottom: 14px;
        gap: 12px !important;
      }
      .doctor-card {
        flex: 0 0 160px !important;
        scroll-snap-align: start;
      }
    }

    /* قسم الهيرو */
    .hero-section {
      background: linear-gradient(180deg, #F0F9FA 0%, #FFFFFF 100%);
      padding: 40px 0 30px;
      border-bottom: 1px solid var(--border-color);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      align-items: center;
    }
    @media (min-width: 768px) {
      .hero-grid {
        grid-template-columns: 1.2fr 1fr;
      }
    }
    .hero-badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--brand-lime-light);
      color: var(--brand-lime-dark);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 16px;
      border: 1px solid rgba(140, 198, 63, 0.3);
    }
    .hero-title {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.25;
      margin-bottom: 16px;
    }
    .hero-title span {
      color: var(--brand-teal);
    }
    .hero-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.7;
    }
    .hero-features {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 26px;
    }
    .feat-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      background: #FFFFFF;
      padding: 7px 16px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.25s ease;
    }
    .feat-item:hover {
      border-color: var(--brand-teal);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 168, 198, 0.12);
    }
    .feat-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--brand-teal-light);
      color: var(--brand-teal);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* بطاقة الحجز */
    .quick-booking-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }
    .quick-booking-card h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--brand-teal-dark);
      margin-bottom: 6px;
    }
    .quick-booking-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-main);
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-color);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: var(--bg-soft);
      transition: var(--transition);
      outline: none;
    }
    .form-control:focus {
      border-color: var(--brand-teal);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(0, 165, 181, 0.15);
    }
    .btn-submit-wa {
      width: 100%;
      background: linear-gradient(135deg, var(--color-wa), var(--color-wa-hover));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
      transition: var(--transition);
    }
    .btn-submit-wa:hover {
      background: var(--color-wa-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.45);
    }

    /* شريط الأرقام والإحصائيات */
    .trust-strip {
      background: #ffffff;
      padding: 24px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .trust-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 18px;
      text-align: center;
    }
    .trust-item h4 {
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--brand-teal);
      line-height: 1.1;
    }
    .trust-item p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 4px;
    }

    /* رؤوس الأقسام */
    .section-head {
      text-align: center;
      margin-bottom: 34px;
    }
    .section-head h2 {
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 900;
      color: var(--brand-teal-dark);
      position: relative;
      display: inline-block;
    }
    .section-head h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 3px;
      background: var(--brand-lime);
      border-radius: var(--radius-full);
    }
    .section-head p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 14px;
    }

    /* الخدمات */
    .services-section {
      padding: 50px 0;
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }
    .service-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }
    .service-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-teal);
    }
    .service-icon-box {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-md);
      background: var(--brand-teal-light);
      color: var(--brand-teal);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      transition: var(--transition);
      border: 1px solid rgba(0, 168, 198, 0.12);
    }
    .service-card:hover .service-icon-box {
      background: var(--brand-teal);
      color: #FFFFFF;
      transform: scale(1.05);
    }
    .service-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
    }
    .service-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 18px;
      flex-grow: 1;
    }
    .service-badge {
      display: inline-flex;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--brand-lime-dark);
      background: var(--brand-lime-light);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      width: fit-content;
      margin-bottom: 14px;
    }
    .service-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: var(--brand-teal-light);
      color: var(--brand-teal-dark);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: var(--transition);
    }
    .service-btn:hover {
      background: var(--brand-teal);
      color: #fff;
    }

    /* لماذا تختارنا */
    .why-section {
      padding: 50px 0;
      background: #FFFFFF;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .why-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .why-card {
      padding: 22px;
      background: var(--bg-soft);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }
    .why-card:hover {
      background: #fff;
      border-color: var(--brand-teal);
      box-shadow: var(--shadow-sm);
    }
    .why-icon-box {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: var(--brand-teal-light);
      color: var(--brand-teal);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      transition: var(--transition);
      border: 1px solid rgba(0, 168, 198, 0.15);
    }
    .why-card:hover .why-icon-box {
      background: var(--brand-teal);
      color: #FFFFFF;
      transform: translateY(-2px);
    }
    .why-card h4 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--brand-teal-dark);
      margin-bottom: 8px;
    }
    .why-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* الفروع */
    .branches-section {
      padding: 50px 0;
    }
    .branches-tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 26px;
    }
    .branch-tab-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--border-color);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--transition);
    }
    .branch-tab-btn.active, .branch-tab-btn:hover {
      background: var(--brand-teal);
      color: #fff;
      border-color: var(--brand-teal);
      box-shadow: var(--shadow-sm);
    }
    .branch-card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 28px;
      border: 1.5px solid var(--border-color);
      box-shadow: var(--shadow-md);
      max-width: 760px;
      margin-inline: auto;
    }
    .branch-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
